name: Bug report
about: Report incorrect behavior or a reproducibility failure
title: "[BUG] "
labels: []
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands/configs and model revision.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hardware, OS, Python/runtime/backend versions. `qlab doctor --json` output is useful.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / measurements
      description: Remove secrets before posting.
